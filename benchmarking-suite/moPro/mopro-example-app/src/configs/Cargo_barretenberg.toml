
[package]
name = "deimos-barretenberg"
version = { workspace = true }
edition = { workspace = true }

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = ["barretenberg"]
barretenberg = ["dep:noir_rs"]

[dependencies]
mopro-wasm = { git = "https://github.com/zkmopro/mopro.git", branch = "v0.2.x" }
mopro-ffi = { version = "0.3.1", features = ["uniffi"] }
thiserror = "2.0.12"
anyhow = "1.0.99"
bincode = "1.3"

# Barretenberg (Noir / UltraHonk) only
noir_rs = { package = "noir", git = "https://github.com/zkmopro/noir-rs", features = [
    "barretenberg",
    "android-compat",
], branch = "v1.0.0-beta.8-3", optional = true }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.94"

[build-dependencies]
cc = "1.0"

[dev-dependencies]
mopro-ffi = { version = "0.3.1", features = ["uniffi-tests"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.94"
serial_test = "3.0.0"
